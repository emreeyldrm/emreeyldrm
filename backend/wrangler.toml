name = "voyage-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Günlük fotoğraf temizliği (AC-MED-1): hiçbir liste öğesinde ve yorumda geçmeyen, 24 saatten eski medya silinir
# (src/index.ts scheduled, src/cleanup-core.ts). Saat UTC.
[triggers]
crons = ["17 3 * * *"]

[vars]
APPLE_BUNDLE_ID = "com.emreeyldrm.voyage"

[[d1_databases]]
binding = "DB"
database_name = "voyage"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Fotoğraflar (POST /media, GET /media/:id). Bir kez: wrangler r2 bucket create voyage-media
# Yerelde (wrangler dev / npm run start:e2e) R2 otomatik olarak taklit edilir (--persist-to altında).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "voyage-media"

# Gizli anahtar: wrangler secret put SESSION_SECRET
# Yer arama: varsayılan Photon (anahtarsız). Google Places için: wrangler secret put GOOGLE_PLACES_API_KEY
# Sağlayıcıyı zorlamak için [vars] altına SEARCH_PROVIDER = "photon" | "google" eklenebilir (testte "fake").
